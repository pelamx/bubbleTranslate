[package]
name = "bubbleTranslate"
version = "0.3.5"
edition = "2024"

# Platform-neutral: the translation engine, config, and the egui interface.
[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
dirs = "6.0.0"
ed25519-dalek = "2"
libc = "0.2"
egui = "0.35.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
toml = "1.1.3"
ureq = "3.3.0"
urlencoding = "2.1.3"

[target.'cfg(target_os = "macos")'.dependencies]
eframe = "0.35.0"
raw-window-handle = "0.6"
core-foundation = "0.10.1"
core-foundation-sys = "0.8"
core-graphics = "0.25.0"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
# Reading text off the screen. On-device: the picture handed to the recogniser
# is whatever was on the user's screen, so it never leaves the machine.
objc2-vision = { version = "0.3.2", default-features = false, features = [
    "std",
    "VNRequest",
    "VNRequestHandler",
    "VNRecognizeTextRequest",
    "VNObservation",
    "VNTypes",
    "objc2-core-foundation",
    # The CIImage handler, for the prepared image.
    "objc2-core-image",
] }
# Scaling and contrast before the recogniser sees the pixels; see ocr.rs for
# why both are worth it and why sharpening is not.
objc2-core-image = { version = "0.3.2", default-features = false, features = [
    "std",
    "CIImage",
    "CIFilterBuiltins",
    "objc2-core-foundation",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFCGTypes",
] }

# The bubble has to place itself at the cursor, and Wayland has no protocol
# that lets a toplevel choose its own position. So on Linux the interface is an
# X11 client throughout — native on an X11 session, XWayland on a Wayland one —
# which is also what makes one binary behave the same across desktops.
# Selections are read over Wayland's data-control protocol where it exists,
# because reading them as an X11 client requires keyboard focus that a
# background translator never has.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.35.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
] }
raw-window-handle = "0.6"
x11rb = { version = "0.13", features = ["xfixes"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# The tray icon, so closing the interface leaves the translator running with
# something to bring it back. Blocking API — the app has no async runtime of
# its own, and ksni gives the service its own thread either way.
ksni = { version = "0.3.6", default-features = false, features = [
    "async-io",
    "blocking",
] }
# The screenshot portal, which is how GNOME and KDE hand an application a
# picture of the screen; see `platform::linux::portal`. The same zbus the tray
# already brings in, on the same executor.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
png = "0.18"
# The reader that works with nothing installed; see `platform::linux::reader`.
# Pure Rust, so the glibc floor the release is built against is unchanged. The
# two models it runs are downloaded on first use rather than carried here.
ocrs = "0.13"
rten = { version = "0.26", default-features = false, features = ["rten_format"] }


# Windows draws through the same toolkit with nothing to choose: there is one
# windowing system, and a toplevel may put itself at the cursor, which is the
# whole reason the Linux side has to work as hard as it does.
#
# One dependency covers the rest of it — the Win32 API, as bindings generated
# from the metadata Microsoft publishes. Every feature below is a namespace
# rather than a library: UI Automation for reading a selection, the low-level
# input hooks for noticing one, the notification area for the tray icon, and a
# named pipe for the second copy of the binary to reach the first.
[target.'cfg(target_os = "windows")'.dependencies]
# Direct3D rather than OpenGL — see the renderer chosen in `main`. The default
# feature set is kept so the glow backend is still compiled in and can be
# switched back to without a dependency change.
eframe = { version = "0.35.0", features = ["wgpu"] }
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    # WinRT rather than Win32, and the only four of those here: the OCR engine
    # Windows ships, the bitmap it takes, and the buffer the screen copy is
    # handed over in. See `platform::windows::ocr`.
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Time",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The icon and the version stamp, linked into the .exe itself; see build.rs.
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

# Test-only, and Linux-only: pressing a key on a throwaway X server is how the
# trigger-key gate gets proved rather than assumed. Kept out of the shipped
# binary — a dev-dependency's features are not unified into a normal build.
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13", features = ["xfixes", "xtest"] }

# Clippy runs in CI with warnings as errors. The one lint turned off: the
# pointer caches and gesture state are tuples of options by design, and naming
# each shape would add a type per call site that says less than the tuple does.
[lints.clippy]
type_complexity = "allow"

# The neural reader is unusably slow unoptimised — seconds per line — so a
# debug build optimises it even when it optimises nothing else.
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.ocrs]
opt-level = 3
