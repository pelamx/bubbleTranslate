# Runs the client's tests on all three systems it ships for, and the licence
# service's tests, on every push and pull request. Each system has its own
# platform code, so a change built on one machine is proved on the other two
# here rather than on release day.
#
# Ubuntu is pinned rather than `ubuntu-latest`, so a runner image moving to a
# new release is a change made here on purpose, not a surprise red build.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  service:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
