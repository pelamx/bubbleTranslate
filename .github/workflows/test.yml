# Runs the client's tests on all three systems it ships for, and the licence
# service's tests, on every push and pull request. Each system has its own
# platform code, so a change built on one machine is proved on the other two
# here rather than on release day.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked

  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
