# Keeps latest.json at the root of this repository a copy of the one in
# pelamx/downloads.
#
# 0.2.7 and every version before it look for updates here, at
# raw.githubusercontent.com/pelamx/bubbleTranslate/main/latest.json. Without
# this copy they get a 404, take it as "nothing new", and never tell anyone an
# update exists. The downloads repository stays the one the release scripts
# write to; this only follows it.
name: Mirror latest.json

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the manifest from the downloads repository
        run: |
          curl -fsSL https://raw.githubusercontent.com/pelamx/downloads/main/latest.json -o latest.next
          # Refuse anything that is not a manifest, so an error page never
          # replaces the file old copies read.
          jq -e '.linux.version and .macos.version and .windows.version' latest.next >/dev/null
          mv latest.next latest.json
          if git diff --quiet -- latest.json; then
            echo "latest.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mirror latest.json from pelamx/downloads" -- latest.json
          git push
