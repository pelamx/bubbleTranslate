name = "bubbletranslate-licence"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# The hostname the app calls. Declared here, and top-level on purpose: in TOML
# any key after a table header joins that table, so a `routes` written further
# down would silently become part of it and a deploy would drop the domain.
#
# `custom_domain` rather than a route pattern because this is a Workers custom
# domain: Cloudflare owns the DNS record and the certificate for it, which is
# what makes `api.bubbletranslate.app` resolve at all.
routes = [
  { pattern = "api.bubbletranslate.app", custom_domain = true }
]

# Local `wrangler dev` ignores database_id and uses a SQLite file under
# .wrangler/; the real one is what `--remote` and `wrangler deploy` bind to.
[[d1_databases]]
binding = "DB"
database_name = "bubbletranslate-licence"
database_id = "2a1d9813-734e-4380-bee6-60ea0e91f704"

[vars]
# Everything here is deployed to production as written. Anything that must
# differ locally belongs in `.dev.vars`, which is gitignored and overrides
# these under `wrangler dev` — that is where DEV_MODE now lives.
#
# DEV_MODE is deliberately absent. It opens /v1/pubkey and /v1/dev/issue and
# lets the service mint its own signing key; in production the key arrives as
# a secret and licences are created only by a processor's webhook. Setting it
# here once would ship a licence generator to the open internet.

# Where this service is reachable, without a trailing slash. It cannot be
# inferred from the request: a PayTR callback arrives from PayTR, not from a
# browser on the site, and the return URLs are built before either.
PUBLIC_BASE_URL = "https://api.bubbletranslate.app"

SUPPORT_EMAIL = "support@bubbletranslate.app"

# -- PayTR, for Turkey --------------------------------------------------------
#
# ⚠ SET THESE BEFORE TAKING A LIRA PAYMENT. They are the two numbers in this
# whole system that cannot be derived from anything else.
#
# In kuruş: 4900 is ₺49,00. Kuruş rather than lira because it is the unit PayTR
# is given, and the unit an integer cannot round wrongly.
#
# These are deliberately NOT a conversion of $2 and $20. PayTR settles in lira,
# and a subscription whose price follows the exchange rate is one no customer
# can budget for and no accountant can reconcile. Pick a number, and revisit it
# when you mean to — a price change should be a decision, not a side effect.
# Until both are set, /buy tells Turkish visitors that checkout is unavailable
# and offers them the dollar page instead; it never charges zero.
PAYTR_PRICE_MONTHLY_KURUS = ""
PAYTR_PRICE_YEARLY_KURUS = ""

# "1" runs PayTR in test mode, where no card is really charged.
PAYTR_TEST_MODE = "1"

# -- Paddle, for everywhere else ----------------------------------------------
#
# "sandbox" until it is "production". This chooses both the API host and the
# Paddle.js environment, so the two can never disagree.
PADDLE_ENV = "sandbox"

# From the Paddle catalogue, `pri_...`. The prices themselves ($2/month,
# $20/year) are set in Paddle, not here — Paddle is the merchant of record and
# owns what the customer is charged, including tax.
PADDLE_PRICE_MONTHLY = ""
PADDLE_PRICE_YEARLY = ""

# The browser-side token Paddle.js is initialised with. Publishable by design —
# it appears in the page source — and not a secret.
PADDLE_CLIENT_TOKEN = ""

# Secrets, set with `wrangler secret put` and never written here:
#
#   SIGNING_KEY_PKCS8        base64url PKCS#8, the licence signing key
#   SIGNING_KEY_PUBLIC       its public half as hex — also PUBLIC_KEY_HEX in
#                            src/license.rs
#   PAYTR_MERCHANT_ID
#   PAYTR_MERCHANT_KEY
#   PAYTR_MERCHANT_SALT
#   PADDLE_API_KEY           server-side, for cancellations and customer lookup
#   PADDLE_WEBHOOK_SECRET    the notification destination's signing secret
#   RESEND_API_KEY           optional; without it the key is shown on the
#   MAIL_FROM                success page only
#   ADMIN_PASSWORD           unlocks /admin. Leave it unset and the route does
#                            not exist -- it answers 404, not 401, so an
#                            unconfigured deployment advertises no panel.
